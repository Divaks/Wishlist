name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel redundant in-progress runs when pushing new commits to a PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint + Test ──────────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: couple-wishlist-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: couple-wishlist-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings 0

      - name: Run Tests
        run: npm test -- --coverage

  # ── Job 2: Reviewdog inline PR annotations ─────────────────────────────────
  reviewdog-eslint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: couple-wishlist-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: couple-wishlist-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint Reviewer
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          workdir: couple-wishlist-api
          eslint_flags: '.'

  # ── Job 3: Gemini AI Code Review ───────────────────────────────────────────
  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: AI PR Review
        uses: sshnaidm/gemini-code-review-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
